# nginx config for the boydroid.nl site container on the VPS: copy next to its compose file as ./nginx.conf,
# mounted as /etc/nginx/conf.d/default.conf.
# Serves the static Astro build (dist/, uploaded to ./html) and replaces Cloudflare's public/_redirects.
# HTTPS and the domain are handled by the reverse proxy in front of this container.

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # Relative redirects, so /contact -> /contact/ keeps the public https host behind the proxy.
  absolute_redirect off;

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  # Hashed build assets never change, so browsers may cache them forever.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Old WordPress URLs -> new site (mirrors public/_redirects)
  location = /wp-content/uploads/2026/05/Algemenevoorwaarden.pdf { return 301 /algemene-voorwaarden.pdf; }
  location = /algemenevoorwaarden.pdf { return 301 /algemene-voorwaarden.pdf; }
  location = /av.pdf { return 301 /algemene-voorwaarden.pdf; }
  location = /av { return 301 /algemene-voorwaarden.pdf; }
  location ~ ^/apps/newapps-white-label-ov-app/?$ { return 301 /apps/ov-app/; }
  location ~ ^/apps/?$ { return 301 /portfolio/; }
  location ~ ^/klanten/?$ { return 301 /portfolio/; }
  location /customers/ { return 301 /portfolio/; }
  location ~ ^/nieuws/?$ { return 301 /; }
  location ~ ^/kosten/?$ { return 301 /werkwijze/; }
  location /feed/ { return 301 /; }
  location /wp-admin/ { return 301 /; }
  location = /wp-login.php { return 301 /; }
}
